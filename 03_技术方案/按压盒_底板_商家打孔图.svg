<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef3f7"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#557080" flood-opacity=".18"/></filter>
 <style>
 .title{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:31px;font-weight:700;fill:#17324d}
 .h2{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:22px;font-weight:700;fill:#17324d}
 .label{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:18px;fill:#19354d}
 .small{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:16px;fill:#36546a}
 .dimtxt{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:18px;font-weight:700;fill:#875315}
 .holetext{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:15px;font-weight:700;fill:#a62e2e}
 .dimline,.tick{stroke:#875315;stroke-width:2;fill:none}
 .center{stroke:#90a8b8;stroke-width:1.5;stroke-dasharray:8 6}
 .leader{stroke:#1b6499;stroke-width:2;fill:none}
 .plate{fill:#d8f0fa;fill-opacity:.78;stroke:#247ca5;stroke-width:3}
 .hole{fill:#fff;stroke:#c32929;stroke-width:3}
 .note{font-family:'Noto Sans CJK SC','Noto Sans CJK','DejaVu Sans',sans-serif;font-size:17px;fill:#fff;font-weight:700}
 </style>
</defs>
<rect width="1400" height="1000" fill="url(#paper)"/>
<text x="60" y="62" class="title">按压盒底板打孔图</text>
<text x="60" y="98" class="small">四孔左右两组对称布置；底板是导柱固定基准面。</text>
<rect x="50" y="130" width="780" height="800" rx="18" fill="#fff" stroke="#c6d5e1" stroke-width="2"/>
<rect x="860" y="130" width="490" height="800" rx="18" fill="#fff" stroke="#c6d5e1" stroke-width="2"/>
<text x="80" y="172" class="h2">俯视打孔图（单位：mm）</text>
<text x="890" y="172" class="h2">孔位与加工要求</text>
<rect x="130" y="215" width="600" height="600" class="plate" filter="url(#shadow)"/><line x1="130" y1="167" x2="730" y2="167" class="dimline"/><line x1="130" y1="161" x2="130" y2="173" class="tick"/><line x1="730" y1="161" x2="730" y2="173" class="tick"/><text x="430.0" y="155" class="dimtxt" text-anchor="middle">200</text><line x1="82" y1="815" x2="82" y2="215" class="dimline"/><line x1="76" y1="815" x2="88" y2="815" class="tick"/><line x1="76" y1="215" x2="88" y2="215" class="tick"/><text x="64" y="515.0" class="dimtxt" transform="rotate(-90 64 515.0)">200</text><line x1="100" y1="515" x2="760" y2="515" class="center"/><line x1="430" y1="845" x2="430" y2="185" class="center"/><circle cx="295" cy="581" r="8.25" class="hole"/><text x="303" y="573" class="holetext">1</text><circle cx="295" cy="449" r="8.25" class="hole"/><text x="303" y="441" class="holetext">2</text><circle cx="565" cy="581" r="8.25" class="hole"/><text x="573" y="573" class="holetext">3</text><circle cx="565" cy="449" r="8.25" class="hole"/><text x="573" y="441" class="holetext">4</text><line x1="295" y1="629" x2="565" y2="629" class="dimline"/><line x1="295" y1="623" x2="295" y2="635" class="tick"/><line x1="565" y1="623" x2="565" y2="635" class="tick"/><text x="430.0" y="617" class="dimtxt" text-anchor="middle">90（左右孔中心距）</text><line x1="616" y1="581" x2="616" y2="449" class="dimline"/><line x1="610" y1="581" x2="622" y2="581" class="tick"/><line x1="610" y1="449" x2="622" y2="449" class="tick"/><text x="598" y="515.0" class="dimtxt" transform="rotate(-90 598 515.0)">44（同侧两孔中心距）</text><rect x="80" y="205" width="220" height="42" rx="8" fill="#e9f4fb" stroke="#8eb5ca" stroke-width="1.5"/><text x="96" y="232" class="label">4 × Φ5.5 通孔</text><text x="890" y="220" class="label">板件：200 × 200 × 8 mm 亚克力底板</text><text x="890" y="270" class="label">四孔中心坐标（以板中心为原点）</text><text x="900" y="310" class="small">孔 1：X = −45，Y = −22</text><text x="900" y="342" class="small">孔 2：X = −45，Y = +22</text><text x="900" y="374" class="small">孔 3：X = +45，Y = −22</text><text x="900" y="406" class="small">孔 4：X = +45，Y = +22</text><rect x="890" y="445" width="420" height="94" rx="12" fill="#155f98"/><text x="910" y="478" class="note">布置方式：左右两侧各两个孔</text><text x="910" y="508" class="note">中间区域留给手掌按压</text><text x="890" y="590" class="label">加工要求</text><text x="900" y="630" class="small">• 孔径：Φ5.5 mm，贯穿整块板</text><text x="900" y="662" class="small">• 孔中心距板边保持足够余量</text><text x="900" y="694" class="small">• 四孔必须与另外两张板完全同轴</text><text x="900" y="726" class="small">• 孔位公差建议：±0.5 mm</text><text x="900" y="758" class="small">• 方板以 200×200 外形中心为原点</text><rect x="890" y="805" width="420" height="78" rx="12" fill="#fff1df" stroke="#d6a04e" stroke-width="2"/><text x="910" y="838" class="small" fill="#704610">商家备注：四张图的孔中心坐标相同；</text><text x="910" y="866" class="small" fill="#704610">不要按四角正方形布孔。</text></svg>