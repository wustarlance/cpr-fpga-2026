<svg xmlns="http://www.w3.org/2000/svg" width="1056" height="1200" viewBox="0 0 352 400"><rect width="352" height="400" fill="#102030"/>
<text x="16" y="12" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#58e0bc">成人心肺复苏  /  教程 03 · 04</text>
<text x="16" y="32" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="25" fill="#f3f7fa">开放气道与人工呼吸</text>
<text x="16" y="63" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#b6c9d5">仅供受训且愿意通气者：按压 30 · 通气 2</text>
<rect x="16" y="86" width="320" height="120" rx="12" fill="#142b3b" stroke="#284859"/>
<ellipse cx="78.0" cy="143.0" rx="38.0" ry="38.0" fill="#244e5b" stroke="none"/>
<text x="78" y="132" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" fill="#58e0bc">30</text>
<text x="78" y="161" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#f3f7fa">按压</text>
<ellipse cx="217.0" cy="143.0" rx="38.0" ry="38.0" fill="#244e5b" stroke="none"/>
<text x="217" y="132" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="32" fill="#58e0bc">2</text>
<text x="217" y="161" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="14" fill="#f3f7fa">通气</text>
<polyline points="129,144 156.6,144.0" fill="none" stroke="#58e0bc" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="163,144 155.7964231811786,147.47972427288985 155.7964231811786,140.52027572711015" fill="#58e0bc" stroke="none"/>
<path d="M204 183 C178 201 124 201 99 187" fill="none" stroke="#58e0bc" stroke-width="2" stroke-linecap="round"/>
<polygon points="99.0,187.0 107.96154872992231,186.16894984433688 104.54125003583732,194.09186491977482" fill="#58e0bc" stroke="none"/>
<text x="264" y="138" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#f3f7fa">重复循环</text>
<ellipse cx="24.5" cy="230.5" rx="8.5" ry="8.5" fill="#244e5b" stroke="none"/>
<text x="24.5" y="230.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#58e0bc">1</text>
<text x="41" y="222" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#f3f7fa">按压 30 次，再进行 2 次人工呼吸。</text>
<ellipse cx="24.5" cy="257.5" rx="8.5" ry="8.5" fill="#244e5b" stroke="none"/>
<text x="24.5" y="257.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#58e0bc">2</text>
<text x="41" y="249" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#f3f7fa">仰头提颏开放气道；疑似颈椎伤听从 120 指导。</text>
<ellipse cx="24.5" cy="284.5" rx="8.5" ry="8.5" fill="#244e5b" stroke="none"/>
<text x="24.5" y="284.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#58e0bc">3</text>
<text x="41" y="276" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#f3f7fa">捏鼻、密封口部，每次吹气约 1 秒，看胸廓起伏。</text>
<ellipse cx="24.5" cy="311.5" rx="8.5" ry="8.5" fill="#244e5b" stroke="none"/>
<text x="24.5" y="311.5" text-anchor="middle" dominant-baseline="central" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#58e0bc">4</text>
<text x="41" y="303" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#f3f7fa">两次通气后立即续按；避免过快或过度通气。</text>
<rect x="16" y="339" width="320" height="29" rx="7" fill="#18493f" stroke="none"/>
<text x="26" y="345" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="13" fill="#58e0bc">未受训、不愿或不能通气：持续胸外按压。</text>
<text x="16" y="379" dominant-baseline="text-before-edge" font-family="Noto Sans CJK SC,Microsoft YaHei,sans-serif" font-size="11" fill="#b6c9d5">成人培训示意 · 请结合规范实操教学 · 急救请拨 120</text>
</svg>